name = "QuadraticIterates"
defaultTargets = ["QuadraticIterates"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
# Mathlib's standard style linters (the `weak.` prefix is needed for options that Mathlib, not
# Lean, registers), plus the two `omega` analyzers: every `omega` that `lia` can replace is
# reported, and every `omega` that `lia` cannot replace is reported too (a `lia` bug to minimize).
weak.linter.mathlibStandardSet = true
weak.linter.style.header = true
weak.linter.style.longFile = 1500
weak.linter.tacticAnalysis.omegaToLia = true
weak.linter.tacticAnalysis.regressions.omegaToLia = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

# Only used by `lake build QuadraticIterates:docs`, which generates the API documentation deployed
# alongside the blueprint (see .github/workflows/deploy-pages.yml). A plain `lake build` does not
# build it. Keep `rev` in sync with `lean-toolchain`.
[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "QuadraticIterates"

# Comparator (https://github.com/leanprover/comparator) verification harness. Not part of
# `defaultTargets`, so a plain `lake build` ignores it. See comparator/README.md.
[[lean_lib]]
name = "Challenge"
srcDir = "comparator"

[[lean_lib]]
name = "Solution"
srcDir = "comparator"
