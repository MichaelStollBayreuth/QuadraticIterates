    - source: "Li 2021, Theorem 3.9"
      lean: "li2021_theorem_3_9"
      module: "QuadraticIterates.Main.Integers"
      status: "proved"
      note: "the case v = 1 of nonempty_mulEquiv_of_eq_neg_sq_add_add_one"
    - source: "Li 2020, Lemmas 3.1-3.3 and Theorem 3.4"
      lean: ""
      module: ""
      status: "not formalized"
      note: "the b_n route is not formalized on this branch"
    - source: "Theorem R⁺ (rational a = r/s > -1; author's working notes, not in the papers)"
      lean: "nonempty_mulEquiv_of_neg_lt_of_certificate, criteria_of_neg_lt_of_certificate"
      module: "QuadraticIterates.Main.SquarefreeCertificates"
