# how it was produced.
automation:
  methods:
    - method: "autonomous"
      models: ["Logos Model"]
      framework: "Logos Research (https://www.logosresearch.ai/)"
      tool_setup: ""
      cost:
        wall_time: "~2 days"
        spend_usd: "free trial access"
        hardware: ""
      prompting_notes: >
        Initial autonomous formalization of the paper; the resulting code compiled but did not
        meet Mathlib quality standards. It was fully replaced (see next entry).
    - method: "agent"
      models: ["claude-opus-4.8", "claude-fable-5", "claude-opus-5", "claude-fable-5.1",
        "claude-opus-5.5"]
      framework: "Claude Code"
      tool_setup: >
        Interactive agent sessions directed by the author, with project-specific style and
        design conventions (CLAUDE.md/MATHLIB.md) enforced. The AI-generated original was
        reduced to a statement skeleton (all proofs replaced by `sorry`, names aligned with
        Mathlib conventions); all proofs were then re-proved from scratch, followed by
        multi-round review/refactor passes (parallel audit sub-agents, per-round improvement).
        Each refactoring round was gated by a scripted verification chain: warning-free build of
        the library and of the comparator challenge/solution (from 2026-09-06 with Mathlib's
        standard linter set and its omega-to-lia analyzers enabled in the lakefile), a project
        style lint for the conventions no linter covers (omega, lambda arrows, bare rintro,
        proofs over 20 lines, ...), line-length check, blueprint rebuild and declaration check,
        and a diff of the pretty-printed types of every declaration in the project against the
        previous round, so that a round changed exactly the intended statements.
      cost:
        wall_time: "~99 hours in 15 interactive sessions between 2026-07-12 and 2026-09-07"
        spend_usd: "Claude Max 20x subscription"
        hardware: "API-only"
      prompting_notes: >
        Paper-counterpart statements were frozen; the agent was free to restructure all
        auxiliary definitions, lemmas and proofs. Review rounds followed a fixed lens order
        (structure, extraction of general content, deduplication, docstrings, style,
        ergonomics), one idea per commit. Every file was taken through this cycle: first the
        23 supporting files under QuadraticIterates/Mathlib/, then each of the five files of
        the paper proper, each closed by a line-level audit along three lenses (proof length,
        Mathlib duplication and naming, style and documentation) run by parallel sub-agents
        whose proposals had to compile before being applied. The extensions of Li were first
        planned in a blueprint chapter (statements, proofs reduced to the existing
        infrastructure, order of work), reviewed by the author, and then formalized in seven
        verified commits, one per layer or theorem. A subsequent exploration session (open-ended
        brainstorming on pushing Stoll's method to further parameters, with numerical
        experiments in Python/PARI and candidate statements checked in Lean before anything was
        integrated) produced the strengthening of Li's Theorem 3.3 to a = -(4k+2)(4k+3), which
        replaced the original formalization of that theorem, and the rational-parameter
        theorems R⁺ and R⁻, proved on paper in the author's notes and then formalized the same
        way: a blueprint chapter reducing them to the existing material plus new lemmas, reviewed
        by the author, then one verified commit per layer on a branch. Two clauses of the
        theorems were found during the formalization, when the mechanisms behind two squarefree-
        level lemmas turned out to be independent of the sign of the parameter; they were checked
        numerically before being added. The rational-parameter files were then audited like the
        paper files: five lenses (hypotheses, general content, placement and naming, proof
        structure, style and documentation) run by parallel sub-agents, applied in four themed
        rounds, each verified by the chain and, where a challenge name changed, by the comparator.
        The update to Lean and Mathlib v4.35.0 (2026-10-15) was done with claude-opus-5.5: the
        build fixes, the switch of the comparator check to Lake's built-in `lake comparator`,
        and a simplification pass toward the new versions, each step gated by the verification chain.
        On the branch `simplified` (2026-10-15/16) the formalization was rebuilt with
        claude-opus-5.5 around the author's quadratic-character method: a new blueprint, written
        from the author's notes and the agent's comments on them and reviewed by the author before
        any Lean, fixed the statements, names and order of work; the agent then
        formalized it step by step (Galois side, characters, sequences, patterns, main theorem,
        families, integer corollaries) in an unattended overnight run, each step a scratch
        sandbox audited against the conventions and then one or two commits through the
        verification chain and the comparator, and finally removed the b_n route. A case
        analysis of the main theorem by the classes of (r, s) mod 4 (2026-10-16), asked for by
        the author and checked numerically in PARI/GP on several hundred thousand parameters
        before any Lean, gave the two corollaries of Main/LevelTwo.lean and Main/Interval.lean,
        planned in the blueprint, reviewed by the author, then formalized the same way. A
        2-adic refinement of the classes on the interval α < a < -1 (2026-10-17), prompted by a
        question of the author, was worked out by the agent, checked numerically on all coprime
        pairs with s ≤ 2500, and formalized as a third corollary with a comparator challenge.
        A search for the missing character on the parameters still uncovered (exact patterns of
        all characters at a few hundred primes, a hit verified by a linear-recurrence bound) found
        it in every example and showed which primes supply it; the resulting criteria from the
        primes of v_2, v_3 and w_3 were written into the blueprint, reviewed by the author, and
        formalized in Main/Further.lean. When the author had written a paper on the method
        (2026-10-21), the agent reorganized the blueprint to follow its sections and numbering,
        with the supporting statements lettered per chapter and the proof of the 1992 criterion
        and the further results in appendices, and formalized the paper's statements that had
        no single declaration yet (rigid divisibility of (c_n), the shapes of its p-adic
        valuations, its vanishing terms, and two criteria combining characters), each through
        the scratch sandbox and the verification chain. On the author's review it then derived
        the paper's corollaries as the paper does (Corollary 6.3 from Theorem 6.1(1) in a new
        form with the three non-squares, Corollary 7.4 as the case k = 1 of Theorem 7.3, and the
        rational form of Li's 2020 theorem from Theorem 6.1(1)), and renamed the declarations
        named after the older papers by their statements, with the comparator challenges
        following. A further audit of the whole library (2026-10-22) ran as one workflow of
        claude-opus-5.5 sub-agents: twelve auditors (seven by file group, five across files:
        the scripted scans, documentation and names, cross-file structure, and two on the
        mathematics), each followed by an adversarial verifier that compiled every proposal,
        and a completeness critic. The verified improvements that change no cited statement
        were applied in three rounds (per file in parallel, then the shared cross-file API, then
        small fixes and layout), each gated by the verification chain; the proposals that would
        change cited statements or the mathematics were collected for the author.
  spend_usd: "subscription-based usage (no metered API spend)"
  notes: >
    Two-phase process: a discarded fully autonomous first version, then an author-directed
    agent rebuild against a frozen statement skeleton, with continuous human review.

# fidelity
fidelity:
  divergences: >
    The aim of this branch is not to reproduce the proofs of the three papers, but to give
    different, simpler proofs of their main results and to extend them to further cases and to
    rational parameters; the deviations listed here follow from that. The Galois side (splitting
    fields, Lemmas 1.4-1.6, part 1 of the Section 1 theorem) is formalized for a rational
    parameter a. Part 1 of the Section 1 theorem, (a) ⟺ (b), needs no
    hypothesis on a: maximality of Ω_n forces f_1, …, f_n to be irreducible. Lemma 1.6
    (`relfinrank_succ_eq_two_pow_iff`) is proved for irreducible f_n with c_{n+1} ≠ 0, uniformly in
    n, which is weaker than the paper's maximality hypothesis; Lemma 1.5 needs no hypothesis on a.
    The sequence c_n is a total function with a junk value at index 0. The proof of the main
    result of Section 3 is not the paper's (which goes through the b_n): it is the case s = 1 of
    the rational main theorem. Li's Theorem 3.3 (2021) is formalized in the stronger form
    a = -(4k+2)(4k+3), his statement being the case of even k; his Theorems 3.3, 3.9 (2021) and
    3.5 (2020) are the case v = 1 of rational families, not proved by his method. The rational
    main theorem needs no exclusion of a = -1, 0, which its hypotheses rule out. The theorems R⁺
    and R⁻ for rational parameters of the author's working notes are rederived here from the
    rational main theorem: their hypotheses imply its hypotheses. The index-2 statement of the 2020 paper and the b_n-based
    lemmas of all three papers are not formalized on this branch; the main branch formalizes the
    b_n route.

# review status
review:
  status: "author-verified"
  reviewers: ["Michael Stoll"]
  notes: >
    The formalization was directed and reviewed round-by-round by the author of the source
    paper, including the choice of formal statements for all paper-counterpart results.

# alignment - how source statements map to formal declarations.
alignment:
  namespace: "QuadraticIterates"
  statements:
    - source: "Lemma 1.0 (Kummer tower facts)"
      lean: "splittingField_succ_eq_sup_adjoin, relfinrank_succ_le"
      module: "QuadraticIterates.Galois.Tower"
      status: "proved"
    - source: "Lemma 1.1 a), b)"
      lean: ""
      module: ""
      status: "not formalized"
      note: "the b_n route is not formalized on this branch; the shape of the valuations v_p(c_n) behind b) is padicValRat_cSeq_trichotomy (QuadraticIterates.Sequence.Valuation)"
    - source: "Lemma 1.2"
      lean: "irreducible_iteratedPoly_of_not_isSquare_cSeq"
      module: "QuadraticIterates.Galois.Irreducibility"
      status: "proved"
    - source: "Corollary 1.3"
      lean: ""
      module: ""
      status: "not formalized"
      note: "the rational statements need irreducibility only through maximality (irreducible_iteratedPoly_of_nonempty_mulEquiv)"
    - source: "Odoni's embedding theorem"
      lean: "exists_injective_monoidHom_wreathPower"
      module: "QuadraticIterates.Galois.Tower"
      status: "proved"
    - source: "Lemma 1.4"
      lean: "nonempty_mulEquiv_succ_iff"
      module: "QuadraticIterates.Galois.Tower"
      status: "proved"
    - source: "Lemma 1.5"
      lean: "not_isSquare_algebraMap_iff_twoIndependent_snoc"
      module: "QuadraticIterates.Galois.DegreeCriterion"
      status: "proved"
      note: "for any rational a, without the standing assumption on a"
    - source: "Lemma 1.6"
      lean: "relfinrank_succ_eq_two_pow_iff"
      module: "QuadraticIterates.Galois.DegreeCriterion"
      status: "proved"
      note: "for any rational a with f_n irreducible and c_{n+1} ≠ 0, which is weaker than the paper's maximality hypothesis, and extended to n = 0"
    - source: "Theorem (Section 1), part 1"
      lean: "nonempty_mulEquiv_iff_twoIndependent, nonempty_mulEquiv_iff_twoIndependent_of_irreducible"
      module: "QuadraticIterates.Galois.Criterion"
      status: "proved"
      note: "(a) ⟺ (b) for every rational a; (c), about the b_n, is not formalized on this branch"
    - source: "Theorem (Section 1), part 2"
