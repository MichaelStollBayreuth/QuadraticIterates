      module: "QuadraticIterates.Galois.Tower"
      status: "proved"
    - source: "Lemma 1.1 a), b)"
      lean: ""
      module: ""
      status: "not formalized"
      note: "the b_n route is not formalized on this branch"
    - source: "Lemma 1.2"
      lean: "irreducible_iteratedPoly_of_not_isSquare_cSeq"
      module: "QuadraticIterates.Galois.Irreducibility"
      status: "proved"
    - source: "Corollary 1.3"
      lean: ""
      module: ""
      status: "not formalized"
      note: "the rational statements need irreducibility only through maximality (irreducible_iteratedPoly_of_nonempty_mulEquiv)"
    - source: "Odoni's embedding theorem"
      lean: "exists_injective_monoidHom_wreathPower"
      module: "QuadraticIterates.Galois.Tower"
      status: "proved"
    - source: "Lemma 1.4"
      lean: "nonempty_mulEquiv_succ_iff"
      module: "QuadraticIterates.Galois.Tower"
      status: "proved"
    - source: "Lemma 1.5"
      lean: "not_isSquare_algebraMap_iff_twoIndependent_snoc"
      module: "QuadraticIterates.Galois.DegreeCriterion"
      status: "proved"
      note: "for any rational a, without the standing assumption on a"
    - source: "Lemma 1.6"
      lean: "relfinrank_succ_eq_two_pow_iff"
      module: "QuadraticIterates.Galois.DegreeCriterion"
      status: "proved"
      note: "for any rational a with f_n irreducible and c_{n+1} ≠ 0, which is weaker than the paper's maximality hypothesis, and extended to n = 0"
    - source: "Theorem (Section 1), part 1"
      lean: "nonempty_mulEquiv_iff_twoIndependent, section1_a_iff_b_of_irreducible"
      module: "QuadraticIterates.Galois.Criterion"
      status: "proved"
      note: "(a) ⟺ (b) for every rational a; (c), about the b_n, is not formalized on this branch"
    - source: "Theorem (Section 1), part 2"
      lean: ""
      module: ""
      status: "not formalized"
      note: "replaced by the character criterion forall_nonempty_mulEquiv_of_forall_hasCharPattern (QuadraticIterates.Characters.Criterion)"
    - source: "Lemmas 2.1 and 2.2"
      lean: ""
      module: ""
      status: "not formalized"
      note: "the b_n route is not formalized on this branch"
    - source: "Section 3, main result"
      lean: "section3_main"
      module: "QuadraticIterates.Main.Integers"
      status: "proved"
      note: "the case s = 1 of the rational main theorem nonempty_mulEquiv_of_twoAdicClass_of_criteria"
    - source: "Li 2021, Lemmas 2.1, 2.2, 3.1, 3.4-3.6, Corollary 2.4, Proposition 2.5"
      lean: ""
      module: ""
      status: "not formalized"
      note: "the b_n route is not formalized on this branch"
    - source: "Li 2021, Theorem 3.3"
      lean: "li2021_theorem_3_3"
      module: "QuadraticIterates.Main.Integers"
      status: "proved"
    - source: "Li 2021, Theorem 3.3 for a = -(4k+2)(4k+3), all k (not in the paper)"
      lean: "nonempty_mulEquiv_of_eq_neg_mul"
      module: "QuadraticIterates.Main.Integers"
      status: "proved"
