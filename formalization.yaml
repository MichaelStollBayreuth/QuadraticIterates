      module: "QuadraticIterates.ArchMath1992.Iterates"
      status: "proved"
    - source: "Lemma 1.1 a)"
      lean: "cSeq_pos"
      module: "QuadraticIterates.ArchMath1992.Irreducibility"
      status: "proved"
    - source: "Lemma 1.1 b)"
      lean: "intCast_bSeq, cSeq_eq_prod_bSeq, isCoprime_bSeq, bSeq_ne_zero"
      module: "QuadraticIterates.ArchMath1992.Main"
      status: "proved"
    - source: "Lemma 1.2"
      lean: "irreducible_iteratedPoly_of_not_isSquare_cSeq"
      module: "QuadraticIterates.ArchMath1992.Irreducibility"
      status: "proved"
    - source: "Corollary 1.3"
