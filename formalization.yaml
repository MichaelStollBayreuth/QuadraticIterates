# formalization.yaml (v0.3): repo-root metadata for formalization projects.
# See https://github.com/mathlib-initiative/formalization.yaml

version: "v0.3"

# project - the formalization itself (not the source).
project:
  name: "QuadraticIterates: Galois groups over ℚ of some iterated polynomials"
  authors: ["Michael Stoll"]
  license: "Apache-2.0"

# sources - what was formalized.
sources:
  - title: "Galois groups over ℚ of some iterated polynomials"
    authors: ["Michael Stoll"]
    id: "10.1007/BF01197321"   # Arch. Math. 59 (1992), 239-244
    type: "journal article"
    license: "© 1992 Birkhäuser Verlag, Basel"
    author_contacted: "yes"    # the source author is the formalization author
    prior_work: ""
  - title: "Arboreal Galois representation for a certain type of quadratic polynomials"
    authors: ["Hua-Chieh Li"]
    id: "10.1007/s00013-019-01390-x"   # Arch. Math. 114 (2020), 265-269
    type: "journal article"
    license: "© Springer Nature Switzerland AG 2019"
    author_contacted: "no"
    prior_work: ""
  - title: "On Stoll's criterion for the maximality of quadratic arboreal Galois representations"
    authors: ["Hua-Chieh Li"]
    id: "10.1007/s00013-021-01609-w"   # Arch. Math. 117 (2021), 133-140
    type: "journal article"
    license: "© Springer Nature Switzerland AG 2021"
    author_contacted: "no"
    prior_work: ""

# project status
status:
  scope: >
    Formalization of the criterion of the paper for the Galois group Ω_n of the n-th iterate of
    X² + a to be the full iterated wreath power [C₂]ⁿ (Odoni's embedding theorem, Lemmas 1.0,
    1.2, 1.4-1.6, and part 1 of the Theorem of Section 1 in an unconditional form: for every
    rational a, Ω_n ≅ [C₂]ⁿ if and only if c_1, …, c_n are 2-independent in ℚ*/(ℚ*)²), of its
    reformulation by quadratic characters (all levels are maximal if and only if, for every
    n ≥ 1, some character ℚ* → {±1} takes the value -1 at c_n and 1 at all c_m, m > n; then every
    sign pattern along (c_n) is the pattern of a character), and of
    a criterion for rational parameters a = r/s built on it (QuadraticIterates/Main/): if
    a ≤ -2 or a³ + 2a² + 2a + 2 > 0, the pair (r, s) lies in one of three 2-adic classes, and
    two of three explicit lists of conditions on r and s hold, then Ω_n ≅ [C₂]ⁿ for all n; in these
    classes, all levels are maximal if and only if a has the characters φ₀ and φ₁. Outside
    the interval α < a ≤ α′ ≈ -1.3107 the criterion is sharp: in these 2-adic classes all levels
    are maximal if and only if c_1, c_2 are 2-independent, i.e. Ω_2 ≅ [C₂]²
    (QuadraticIterates/Main/LevelTwo.lean); on α < a < -1 shorter lists of criteria suffice,
    and in explicit classes of (r, s) modulo 32 none is needed
    (QuadraticIterates/Main/Interval.lean); further criteria for the missing pattern come from
    primes at which the orbit of 0 is short (QuadraticIterates/Main/Further.lean). The rigid
    divisibility of (c_n) and the three possible shapes of n ↦ v_p(c_n) are formalized as well
    (QuadraticIterates/Sequence/Orbit.lean and Valuation.lean). The method is the author's; a
    preprint on it is in paper/arboreal-surjective.pdf, and the blueprint follows its sections and
    numbering. The
    main result of Section 3 of the paper and the theorems of H.-C. Li (Theorem 3.5 of 2020,
    Theorems 3.3, strengthened to a = -l(l+1) for every positive l = 2 mod 4, and 3.9 of 2021)
    are derived as in the preprint: from the level-two criterion at s = 1, as c_2 = a(a+1) is
    never a square (QuadraticIterates/Main/Integers.lean), and from two rational families
    extending Li's at denominator 1 (Families.lean). The theorems R⁺ and R⁻ for rational
    parameters of the author's earlier notes are rederived from the main theorem
    (QuadraticIterates/Main/SquarefreeCertificates.lean, a consistency check outside the
    blueprint). Not formalized on this branch:
    the paper's second criterion via the Möbius quotients b_n (part 2 of the Section 1 theorem
    and Lemmas 1.1, 2.1, 2.2), Corollary 1.3, the lemmas of Li's papers about b_n, and the
    index-2 statement of Li 2020. Supporting theory (multiquadratic extensions, iterated wreath
    products, even polynomials, ℤ-valued characters on ℚ*, prime factors in residue classes) is
    developed in Mathlib generality in 31 files under QuadraticIterates/Mathlib/ as upstreaming
    candidates. A LaTeX blueprint with a dependency graph and the generated API documentation
    are published at https://michaelstollbayreuth.github.io/QuadraticIterates/ .
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
