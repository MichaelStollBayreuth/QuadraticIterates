      module: "QuadraticIterates.Main.Integers"
      status: "proved"
      note: "one theorem per case, for all n (the paper has n >= 1); the case s = 1 of the level-two criterion forall_nonempty_mulEquiv_iff_not_isSquare_of_twoAdicClass"
    - source: "Li 2021, Lemmas 2.1, 2.2, 3.1, 3.4-3.6, Corollary 2.4, Proposition 2.5"
