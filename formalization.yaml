# project status
status:
  scope: >
    Complete formalization of the paper: the criterion for the Galois group Ω_n of the n-th
    iterate of X² + a to be the full iterated wreath power [C₂]ⁿ (Theorem of Section 1, both
    parts, including all supporting lemmas 1.0-1.6, 2.1, 2.2 and Odoni's embedding theorem),
    and the main result of Section 3. Also formalized are the results of H.-C. Li (Arch. Math.
    2020 and 2021) extending the Section 3 result: Ω_n is the full wreath power for all n when
    a = -(4k+2)(4k+3) (Li's Theorem 3.3 is the case of even k, a = -(8k+2)(8k+3); the odd case
    is proved here by his method) or a = -((4k+1)(4k+2)+1), and, for a < 0 with a ≡ 3 mod 4
    and -a not a square, if and only if -a - 1 is not a square (QuadraticIterates/Li/); the index-2
    statement of the 2020 paper in the exceptional case and Lemma 3.5 of the 2021 paper are not
    formalized. Supporting theory (multiquadratic extensions, iterated wreath products, even
    polynomials and their factorizations, Möbius quotients of strong divisibility sequences,
    valuations in a UFD) is developed in Mathlib generality in 25 files under
    QuadraticIterates/Mathlib/ as upstreaming candidates. A LaTeX blueprint with a dependency
    graph and the generated API documentation are published at
    https://michaelstollbayreuth.github.io/QuadraticIterates/ .
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
  - declaration: "QuadraticIterates.section1_tfae"
