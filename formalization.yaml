# project status
status:
  scope: >
    Formalization of the criterion of the paper for the Galois group Ω_n of the n-th iterate of
    X² + a to be the full iterated wreath power [C₂]ⁿ (Odoni's embedding theorem, Lemmas 1.0,
    1.2, 1.4-1.6, and part 1 of the Theorem of Section 1 in an unconditional form: for every
    rational a, Ω_n ≅ [C₂]ⁿ if and only if c_1, …, c_n are 2-independent in ℚ*/(ℚ*)²), of its
    reformulation by quadratic characters (all levels are maximal if and only if, for every
    n ≥ 1, some character ℚ* → {±1} takes the value -1 at c_n and 1 at all c_m, m > n), and of
    a criterion for rational parameters a = r/s built on it (QuadraticIterates/Main/): if
    a ≤ -2 or a³ + 2a² + 2a + 2 > 0, the pair (r, s) lies in one of three 2-adic classes, and
    two of three explicit lists of conditions on r and s hold, then Ω_n ≅ [C₂]ⁿ for all n. The
    method is the author's and not yet published. The main result of Section 3 of the paper and
    the theorems of H.-C. Li (Theorem 3.5 of 2020, Theorems 3.3, strengthened to
    a = -(4k+2)(4k+3), and 3.9 of 2021) are derived as the case s = 1 of the rational statements
    and of two rational families extending Li's
    (QuadraticIterates/Main/Integers.lean and Families.lean). The theorems R⁺ and R⁻ for rational
    parameters of the author's earlier notes are rederived from the main theorem
    (QuadraticIterates/Main/SquarefreeCertificates.lean, a consistency check outside the
    blueprint). Not formalized on this branch:
    the paper's second criterion via the Möbius quotients b_n (part 2 of the Section 1 theorem
    and Lemmas 1.1, 2.1, 2.2), Corollary 1.3, the lemmas of Li's papers about b_n, and the
    index-2 statement of Li 2020. Supporting theory (multiquadratic extensions, iterated wreath
    products, even polynomials, ℤ-valued characters on ℚ*, prime factors in residue classes) is
    developed in Mathlib generality in 26 files under QuadraticIterates/Mathlib/ as upstreaming
    candidates. A LaTeX blueprint with a dependency graph and the generated API documentation
    are published at https://michaelstollbayreuth.github.io/QuadraticIterates/ .
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
