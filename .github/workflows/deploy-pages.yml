name: Build and Deploy Pages

# Deploys to <https://michaelstollbayreuth.github.io/QuadraticIterates/>. There is deliberately
# no `paths` filter: the site is built from the Lean sources, the blueprint and `website/`
# together, so almost any change to the repository can stale it. The run is long — the API
# documentation covers all of Mathlib, see the note on that step below — which the
# `github-pages` concurrency group below keeps from piling up.
on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering of the workflow from the GitHub Actions interface

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuadraticIterates
        uses: actions/checkout@v7

      # The upstreaming dashboard is currently not used. To re-enable it, uncomment this step
      # and restore the dashboard include in website/index.md.
      # See https://github.com/leanprover-community/upstreaming-dashboard-action
      # for more details on how this action works and its parameters
      # - name: Generate upstream dashboard snippets
      #   uses: leanprover-community/upstreaming-dashboard-action@e3ee7dc54fd376f093ef62973d7b04cf7beabad0
      #   with:
      #     website-directory: website
      #     project-name: QuadraticIterates
      #     branch-name: ${{ github.event.repository.default_branch }}
      #     # include-drafts: false             # Include draft PRs in the dashboard?
      #     # relevant-labels: "label1,label2"  # Group PRs by 'relevant' based on these labels

      - name: Install and configure Lean, and get mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Build QuadraticIterates
        run: ~/.elan/bin/lake build QuadraticIterates

      # The TeX package list is the one the blueprint actually loads; extend it when the
      # blueprint starts using further packages. `texlive-fonts-recommended` is not there for a
      # `\usepackage`: hyperref's xetex driver sets `\font\XeTeXLink@font=pzdr`, so the build
      # dies on a missing ZapfDingbats metric (`pzdr.tfm`) without it. A full local TeX Live
      # hides that, so this list can only be validated by a CI run.
      - name: Install the blueprint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-lmodern ghostscript graphviz latexmk libgraphviz-dev python3-venv \
            texlive-base texlive-fonts-recommended texlive-latex-base \
            texlive-latex-recommended texlive-xetex
          python3 -m venv ~/blueprint-venv
          ~/blueprint-venv/bin/pip install --upgrade pip
          ~/blueprint-venv/bin/pip install leanblueprint
          # `leanblueprint web` shells out to `plastex`, so the venv must be on PATH for the
          # later steps -- invoking `~/blueprint-venv/bin/leanblueprint` by absolute path leaves
          # the subprocess unable to find it.
          echo "$HOME/blueprint-venv/bin" >> "$GITHUB_PATH"

      - name: Build the blueprint
        run: |
          leanblueprint pdf
          leanblueprint web

      # `leanblueprint web` writes blueprint/lean_decls, so this has to come after it.
      - name: Check the declarations referenced by the blueprint
        run: ~/.elan/bin/lake env lean blueprint/checkdecls.lean

      # doc-gen4 walks the full import closure by construction — `module_facet docInfo` fetches
      # `docInfo` for every import — so there is no way to document only this library and link to
      # Mathlib's hosted docs: `QuadraticIterates:docs` documents all of Mathlib, ~25.8k module
      # jobs, which dominated a 90-minute run. That pass's entire output is `api-docs.db` plus the
      # `doc-data/*.doc` markers, and the HTML under `build/doc` is regenerated from the database
      # by a single `fromDb` run — so caching those two skips the pass whenever the dependency set
      # is unchanged, while the HTML (the multi-gigabyte part, and different on every commit) is
      # deliberately left out. No `restore-keys` on purpose: a cache built against a different
      # Mathlib would leave Lake trusting markers whose database rows no longer match, so it is an
      # exact hit or nothing.
      - name: Cache the API documentation database
        uses: actions/cache@v6
        with:
          path: |
            .lake/build/api-docs.db
            .lake/build/doc-data
          key: DocData-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      # Last, because it is by far the most expensive step even when the cache above hits.
      - name: Build the API documentation
        run: ~/.elan/bin/lake build QuadraticIterates:docs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: website
          destination: ./_site

      # Copied into the built site, not into `website`, so that Jekyll leaves the generated
      # html alone. `actions/jekyll-build-pages` is a container action running as root, so `_site`
      # comes back root-owned and this step -- which runs as `runner` -- has to take ownership
      # before it can write into it. The API documentation is `mv`d rather than copied: it is by
      # far the largest part, and a rename inside the workspace costs neither time nor a second
      # copy on a runner disk that already holds Mathlib. The `du` reports the published size,
      # which has to stay under the 1 GB GitHub Pages limit.
      - name: Add the blueprint and the API documentation to the site
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          cp -r blueprint/web _site/blueprint
          cp blueprint/print/print.pdf _site/blueprint.pdf
          mv .lake/build/doc _site/docs
          du -sh _site/blueprint _site/docs _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
